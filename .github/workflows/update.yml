name: Auto Update

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}

permissions:
  contents: read

jobs:
  update:
    name: Auto Update
    runs-on: ubuntu-latest
    steps:
      - name: Get App Token
        id: app_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v5

      - name: Update Image
        id: update
        run: echo "version=$(./updateImage.sh)" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        id: cpr
        if: steps.update.outputs.version != ''
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.app_token.outputs.token }}
          sign-commits: true
          commit-message: Update to Rust ${{ steps.update.outputs.version }}
          title: Update to Rust ${{ steps.update.outputs.version }}
          branch: auto-update-${{ steps.update.outputs.version }}
          labels: auto-update
          delete-branch: true

      - name: Enable Pull Request Automerge
        if: steps.cpr.outputs.pull-request-operation == 'created'
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ steps.app_token.outputs.token }}
          pull-request-number: ${{ steps.cpr.outputs.pull-request-number }}
          merge-method: squash
